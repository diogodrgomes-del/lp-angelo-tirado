<style>
/* ══════════════════════════════════════════════════════════════════
   ▸▸ PARA MEXER ◂◂

   1) A FOTO DELE — salve como  angelo.jpg  na MESMA PASTA deste
      index.html (de preferencia quadrada, rosto centralizado).
      Sem o arquivo, aparece uma silhueta dourada no lugar.

   2) OS ANTES E DEPOIS — ficam em resultados.html. As fotos vao nas
      pastas  fotos/implantes, fotos/protese, fotos/hof, fotos/facetas.

   3) OS LINKS — mais abaixo, marcados com  [EDITAR 1/2/3/4]
   ══════════════════════════════════════════════════════════════════ */

/* ── palco: cabe em uma tela ───────────────────────────────────── */
.palco{
  position:relative;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1em;
  width:min(100%,27em);
  margin-inline:auto;
  padding:
    calc(1.6em + env(safe-area-inset-top))
    1.7em
    calc(1.15em + env(safe-area-inset-bottom));
  text-align:center;

  /* TUDO escala a partir deste unico numero — o menor entre a altura
     e a largura da tela. E o que faz caber sem rolar em qualquer
     celular, do SE ao Max, sem media query para cada modelo. */
  font-size:clamp(10px, min(1.95vh, 4.3vw), 18px);
}

/* ── foto dele ─────────────────────────────────────────────────── */
.foto{
  position:relative;
  width:9.5em;height:9.5em;border-radius:50%;
  padding:2px;
  background:var(--folha);
  box-shadow:0 .6em 2.2em rgba(0,0,0,.65),0 0 2.4em rgba(212,175,95,.16);
}
.foto .dentro{
  position:relative;
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:
    radial-gradient(80% 70% at 50% 25%, #2a2723, #121110 70%);
  border:3px solid var(--escuro);
  display:flex;align-items:flex-end;justify-content:center;
}
/* silhueta: so aparece enquanto a foto nao existe */
.foto .silhueta{width:72%;height:auto;color:rgba(212,175,95,.34)}
.foto img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 22%;
  display:block;
}

/* ── monograma ─────────────────────────────────────────────────── */
.coroa{display:flex;align-items:center;gap:1em}
.coroa .fio{
  width:2.8em;height:1px;
  background:linear-gradient(90deg,transparent,var(--ouro));
}
.coroa .fio:last-child{background:linear-gradient(90deg,var(--ouro),transparent)}
.mono{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;font-size:1.7em;line-height:1;
  background:var(--folha);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}

/* ── identidade ────────────────────────────────────────────────── */
.tratamento{
  display:block;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;font-size:.5em;line-height:1;
  margin-bottom:.12em;
  background:var(--folha);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}
h1{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:300;font-size:3em;line-height:1.02;
  color:#fff;
  text-shadow:0 .04em .5em rgba(0,0,0,.5);
}
.funcao{
  margin-top:.7em;
  display:flex;align-items:center;justify-content:center;gap:.85em;
  font-size:.72em;font-weight:300;
  letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;
  color:var(--cinza);white-space:nowrap;
}
.funcao .fio{
  height:1px;flex:1;max-width:3.2em;
  background:linear-gradient(90deg,transparent,var(--ouro));
  animation:risca 1.4s var(--curva) 1s both;
}
.funcao .fio:last-child{background:linear-gradient(90deg,var(--ouro),transparent)}
.lema{
  margin-top:.5em;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;font-size:1.28em;line-height:1.3;
  background:var(--folha);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}

/* ── acoes ─────────────────────────────────────────────────────── */
.pastas{width:100%;display:flex;flex-direction:column;gap:.6em}
.acoes{width:100%;display:flex;flex-direction:column;gap:.7em}
.par{display:flex;gap:.7em}

/* celular deitado: vira duas colunas em vez de esticar uma so */
@media (orientation:landscape) and (max-height:560px){
  .palco{
    width:min(100%,54em);
    display:grid;
    grid-template-columns:1fr 1.1fr;
    grid-template-areas:
      "foto   pastas"
      "coroa  pastas"
      "id     acoes"
      "rodape acoes";
    align-items:center;justify-items:center;
    gap:.45em 1.4em;
    font-size:clamp(10px, min(3.1vh,1.5vw), 15px);
  }
  .palco>.foto{grid-area:foto;width:6.5em;height:6.5em}
  .palco>.coroa{grid-area:coroa}
  .palco>.identidade{grid-area:id}
  .palco>.pastas{grid-area:pastas}
  .palco>.acoes{grid-area:acoes}
  .palco>.rodape{grid-area:rodape}
}

/* telas em pe muito curtas (navegador do app comendo altura) */
@media (orientation:portrait) and (max-height:600px){
  .palco{gap:.75em}
  .foto{width:8em;height:8em}
  .contorno{padding:.7em 1em}
}

@media (prefers-reduced-motion:reduce){
  .funcao .fio{transform:none}
}
</style>
</head>
